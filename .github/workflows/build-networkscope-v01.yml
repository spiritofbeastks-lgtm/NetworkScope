name: Build NetworkScope v0.1
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ "NetworkScope_v0.1_Source.zip", ".github/workflows/build-networkscope-v01.yml" ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Unpack
        run: |
          rm -rf network-build && mkdir network-build
          unzip -q NetworkScope_v0.1_Source.zip -d network-build
      - name: Build APK
        working-directory: network-build/NetworkScope
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NetworkScope-v0.1-APK
          path: network-build/NetworkScope/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
